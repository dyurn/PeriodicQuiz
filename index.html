
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Pro Quiz</title>
    
    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-[#0f172a] text-slate-200 overflow-x-hidden;
                font-family: 'Inter', sans-serif;
            }
        }
        @layer components {
            .mono { font-family: 'JetBrains+Mono', monospace; }
            .glass {
                @apply bg-slate-800/70 backdrop-blur-xl border border-white/10;
            }
        }
    </style>

    <!-- Babel pour compiler le TSX directement dans le navigateur -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0/client",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <!-- 
      On utilise text/babel pour que Babel Standalone gère le fichier.
      data-presets="react,typescript" est crucial pour le TSX.
    -->
    <script type="text/babel" data-presets="react,typescript" src="index.tsx"></script>
</body>
</html>
