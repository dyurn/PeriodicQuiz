<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Master Pro</title>
    
    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel pour compiler le code React/TSX à la volée -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- React 18 UMD -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
    
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-[#020617] text-slate-200 overflow-x-hidden min-h-screen selection:bg-blue-500/30;
                font-family: 'Inter', sans-serif;
            }
        }
        @layer components {
            .mono { font-family: 'JetBrains+Mono', monospace; }
            .glass {
                @apply bg-slate-900/60 backdrop-blur-2xl border border-white/5 shadow-[0_0_50px_-12px_rgba(0,0,0,0.5)];
            }
            .btn-game {
                @apply relative overflow-hidden px-8 py-6 rounded-3xl font-black uppercase tracking-widest transition-all duration-300 active:scale-95 flex items-center gap-4 border border-white/10;
            }
            .custom-scrollbar::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }
            .custom-scrollbar::-webkit-scrollbar-track {
                @apply bg-transparent;
            }
            .custom-scrollbar::-webkit-scrollbar-thumb {
                @apply bg-slate-800 rounded-full;
            }
        }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .bg-mesh {
            background-image: 
                radial-gradient(at 0% 0%, hsla(217,100%,10%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(210,100%,15%,1) 0, transparent 50%), 
                radial-gradient(at 50% 100%, hsla(225,100%,5%,1) 0, transparent 50%);
        }
    </style>
</head>
<body class="bg-mesh">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef, useMemo } = React;
        const ReactDOMRoot = ReactDOM.createRoot(document.getElementById('root'));

        // --- COMPONENTS ---

        const Header = ({ onBack, isHome }) => (
          <header className="w-full py-6 px-8 flex justify-between items-center z-50 animate-fade-in">
            <div className="flex flex-col">
              <h1 className="text-xl font-black tracking-tighter text-white">
                PERIODIC<span className="text-blue-500 font-black">.</span>MASTER
              </h1>
              <div className="h-0.5 w-12 bg-blue-500 rounded-full mt-1"></div>
            </div>
            {!isHome && (
              <button 
                onClick={onBack} 
                className="group flex items-center gap-2 px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-white hover:bg-white/10 transition-all"
              >
                <svg className="w-4 h-4 transition-transform group-hover:-translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M15 19l-7-7 7-7" /></svg>
                Menu
              </button>
            )}
          </header>
        );

        const MainMenu = ({ onSelectMode, highscore }) => {
          return (
            <div className="flex flex-col items-center justify-center min-h-[70vh] w-full max-w-5xl mx-auto px-4 animate-slide-up">
              <div className="text-center mb-16">
                <div className="inline-block px-4 py-1.5 rounded-full bg-blue-500/10 text-[10px] font-black text-blue-400 uppercase tracking-[0.4em] mb-6 border border-blue-500/20">
                  Prêt pour l'examen ?
                </div>
                <h2 className="text-5xl sm:text-7xl font-black tracking-tighter text-white mb-4">
                  Periodic.Master
                </h2>
                {highscore > 0 ? (
                  <div className="flex items-center justify-center gap-3">
                    <span className="text-slate-500 font-bold uppercase tracking-widest text-[10px]">Votre record actuel</span>
                    <span className="px-3 py-1 bg-emerald-500/20 text-emerald-400 text-sm font-black mono rounded-lg border border-emerald-500/20">{highscore}/15</span>
                  </div>
                ) : (
                  <p className="text-slate-500 font-bold uppercase tracking-widest text-[10px]">Choisissez un mode pour commencer</p>
                )}
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-8 w-full">
                <button 
                  onClick={() => onSelectMode('game')}
                  className="btn-game group bg-emerald-600/10 hover:bg-emerald-600 text-emerald-400 hover:text-white border-emerald-500/20 shadow-[0_0_50px_-15px_rgba(16,185,129,0.3)]"
                >
                  <div className="flex flex-col items-start">
                    <span className="text-3xl">JOUER</span>
                    <span className="text-[10px] opacity-70 font-bold tracking-[0.2em]">SÉRIE DE 15 QUESTIONS</span>
                  </div>
                  <div className="ml-auto opacity-40 group-hover:opacity-100 transition-all group-hover:scale-110">
                    <svg className="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M13 5l7 7-7 7M5 5l7 7-7 7" /></svg>
                  </div>
                </button>

                <button 
                  onClick={() => onSelectMode('training')}
                  className="btn-game group bg-orange-600/10 hover:bg-orange-600 text-orange-400 hover:text-white border-orange-500/20 shadow-[0_0_50px_-15px_rgba(249,115,22,0.3)]"
                >
                  <div className="flex flex-col items-start">
                    <span className="text-3xl">LIBRE</span>
                    <span className="text-[10px] opacity-70 font-bold tracking-[0.2em]">QUESTIONS SANS FIN</span>
                  </div>
                  <div className="ml-auto opacity-40 group-hover:opacity-100 transition-all">
                    <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
                  </div>
                </button>

                <button 
                  onClick={() => onSelectMode('revision')}
                  className="btn-game group bg-indigo-600/10 hover:bg-indigo-600 text-indigo-400 hover:text-white border-indigo-500/20 shadow-[0_0_50px_-15px_rgba(79,70,229,0.3)]"
                >
                  <div className="flex flex-col items-start">
                    <span className="text-3xl">TABLEAU PERIODIQUE</span>
                    <span className="text-[10px] opacity-70 font-bold tracking-[0.2em]">CONSULTER LES DONNÉES</span>
                  </div>
                  <div className="ml-auto opacity-40 group-hover:opacity-100 transition-all">
                    <svg className="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>
                  </div>
                </button>
              </div>
            </div>
          );
        };

        const RevisionView = ({ elements }) => {
          const [selectedElement, setSelectedElement] = useState(null);
          return (
            <div className="flex flex-col items-center w-full max-w-6xl mx-auto animate-fade-in pb-20 px-4">
              <div className="w-full text-center mb-10">
                <h3 className="text-xl font-black text-white uppercase tracking-widest">Tableau périodique des éléments</h3>
                <p className="text-slate-500 text-[10px] font-bold mt-2 uppercase tracking-widest italic">Interagissez avec le tableau pour explorer</p>
              </div>

              <div className="w-full overflow-x-auto pb-6 custom-scrollbar">
                <div className="grid gap-1.5 min-w-[1000px] p-2 mx-auto" style={{ gridTemplateColumns: 'repeat(18, minmax(0, 1fr))', gridTemplateRows: 'repeat(10, minmax(0, 1fr))' }}>
                  {elements.map((el) => (
                    <button
                      key={el.number}
                      onClick={() => setSelectedElement(el)}
                      style={{ gridRow: el.row, gridColumn: el.col, backgroundColor: `${el.color}15`, borderColor: `${el.color}40` }}
                      className={`aspect-square flex flex-col items-center justify-center border rounded-xl transition-all duration-300 hover:scale-125 hover:z-30 hover:shadow-[0_0_30px_rgba(255,255,255,0.1)] hover:bg-white/10 ${selectedElement?.number === el.number ? 'scale-125 z-40 shadow-[0_0_40px_white/20] ring-2 ring-white/50 bg-white/20 border-white' : ''}`}
                    >
                      <span className="text-[8px] mono opacity-80 leading-none mb-1">{el.number}</span>
                      <span className="text-sm font-black leading-none" style={{ color: el.color }}>{el.symbol}</span>
                    </button>
                  ))}
                </div>
              </div>

              {selectedElement && (
                <div className="fixed bottom-10 left-1/2 -translate-x-1/2 w-full max-w-2xl px-4 z-50 animate-slide-up">
                  <div className="glass rounded-[2.5rem] p-10 flex items-center gap-10 border-white/10 shadow-2xl relative overflow-hidden group">
                    <div className="absolute top-0 right-0 w-32 h-32 bg-white/5 rounded-bl-full translate-x-8 -translate-y-8 group-hover:scale-150 transition-transform duration-700"></div>
                    <div className="w-32 h-32 shrink-0 rounded-3xl flex items-center justify-center text-5xl font-black shadow-inner border-4 bg-white/5" style={{ borderColor: selectedElement.color, color: selectedElement.color }}>
                      {selectedElement.symbol}
                    </div>
                    <div className="flex-1 min-w-0">
                      <p className="text-[10px] uppercase tracking-[0.4em] text-slate-500 font-black mb-3">{selectedElement.category.replace('-', ' ')}</p>
                      <h3 className="text-4xl font-black text-white truncate leading-tight mb-2 tracking-tighter">{selectedElement.name}</h3>
                      <div className="flex gap-6 items-center">
                        <div className="flex flex-col">
                          <span className="text-[8px] uppercase tracking-widest text-slate-500 font-black">Numéro</span>
                          <span className="text-white font-black mono text-xl">{selectedElement.number}</span>
                        </div>
                        <div className="h-8 w-px bg-white/10"></div>
                        <div className="flex flex-col">
                          <span className="text-[8px] uppercase tracking-widest text-slate-500 font-black">Masse</span>
                          <span className="text-slate-400 font-black mono text-xs italic">N/A</span>
                        </div>
                      </div>
                    </div>
                    <button onClick={() => setSelectedElement(null)} className="absolute top-6 right-6 text-slate-600 hover:text-white transition-colors">
                        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        };

        const QuizView = ({ elements, mode, onBack, onComplete }) => {
          const [currentQuestion, setCurrentQuestion] = useState(null);
          const [selectedOption, setSelectedOption] = useState(null);
          const [qIndex, setQIndex] = useState(0);
          const [score, setScore] = useState(0);
          const [timeLeft, setTimeLeft] = useState(8);
          const [isFinished, setIsFinished] = useState(false);
          const timerRef = useRef(null);

          const generateQuestion = useCallback(() => {
            const types = ['NUMBER_TO_NAME', 'NAME_TO_NUMBER', 'SYMBOL_TO_BOTH'];
            const type = types[Math.floor(Math.random() * types.length)];
            const target = elements[Math.floor(Math.random() * elements.length)];
            
            const getOptionString = (el, qType) => {
              if (qType === 'NUMBER_TO_NAME') return el.name;
              if (qType === 'NAME_TO_NUMBER') return el.number.toString();
              return `${el.name} (${el.number})`;
            };

            const correctAnswer = getOptionString(target, type);
            const options = [correctAnswer];
            while (options.length < 4) {
              const randomEl = elements[Math.floor(Math.random() * elements.length)];
              const opt = getOptionString(randomEl, type);
              if (!options.includes(opt)) options.push(opt);
            }

            setCurrentQuestion({ type, targetElement: target, options: options.sort(() => Math.random() - 0.5), correctAnswer });
            setSelectedOption(null);
            setTimeLeft(8);
          }, [elements]);

          useEffect(() => { generateQuestion(); }, [generateQuestion]);

          const handleOptionClick = useCallback((option) => {
            if (selectedOption !== null || isFinished) return;
            clearInterval(timerRef.current);
            setSelectedOption(option);
            if (option !== '__TIMEOUT__' && option === currentQuestion?.correctAnswer) {
              setScore(prev => prev + 1);
            }
          }, [selectedOption, isFinished, currentQuestion]);

          useEffect(() => {
            if (mode === 'game' && !isFinished && selectedOption === null) {
              timerRef.current = setInterval(() => {
                setTimeLeft(prev => {
                  if (prev <= 0.1) {
                    clearInterval(timerRef.current);
                    handleOptionClick('__TIMEOUT__');
                    return 0;
                  }
                  return prev - 0.1;
                });
              }, 100);
            }
            return () => clearInterval(timerRef.current);
          }, [mode, isFinished, currentQuestion, selectedOption, handleOptionClick]);

          const handleNext = () => {
            if (mode === 'game') {
              if (qIndex < 14) {
                setQIndex(prev => prev + 1);
                generateQuestion();
              } else {
                setIsFinished(true);
                onComplete(score);
              }
            } else {
              generateQuestion();
            }
          };

          if (isFinished) {
            const note = (score / 15) * 20;
            return (
              <div className="max-w-md mx-auto glass p-12 rounded-[3rem] text-center animate-slide-up shadow-2xl mt-10 border-emerald-500/20">
                <div className="w-20 h-20 bg-emerald-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg className="w-10 h-10 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" /></svg>
                </div>
                <h2 className="text-3xl font-black text-white mb-2 uppercase tracking-tighter">Terminé !</h2>
                <div className="relative inline-block my-10">
                  <div className="text-8xl font-black text-emerald-500 mono drop-shadow-[0_0_30px_rgba(16,185,129,0.4)]">{score}/15</div>
                  <div className="absolute -top-4 -right-8 bg-white text-slate-900 text-[10px] font-black px-3 py-1.5 rounded-full uppercase tracking-widest shadow-xl">{note.toFixed(1)}/20</div>
                </div>
                <div className="space-y-4">
                  <button onClick={onBack} className="w-full py-5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-2xl font-black uppercase tracking-widest shadow-xl transition-all shadow-emerald-900/20">Menu Principal</button>
                  <button onClick={() => window.location.reload()} className="w-full py-5 bg-white/5 hover:bg-white/10 text-white rounded-2xl font-black uppercase tracking-widest transition-all border border-white/10">Rejouer</button>
                </div>
              </div>
            );
          }

          if (!currentQuestion) return null;

          return (
            <div className={`max-w-2xl mx-auto glass rounded-[3rem] shadow-2xl animate-fade-in overflow-hidden mt-6 mb-20 border-t-2 ${mode === 'game' ? 'border-t-emerald-500/50' : 'border-t-orange-500/50'}`}>
              {mode === 'game' && (
                <div className="h-2 w-full bg-slate-900">
                  <div className={`h-full transition-all duration-100 ease-linear ${timeLeft < 3 ? 'bg-rose-500 shadow-[0_0_15px_rgba(244,63,94,0.5)]' : 'bg-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.3)]'}`} style={{ width: `${(timeLeft / 8) * 100}%` }} />
                </div>
              )}

              <div className="p-12">
                <div className="flex justify-between items-center mb-16">
                  <div className="px-5 py-2 rounded-xl bg-white/5 border border-white/5 text-[10px] font-black text-blue-400 uppercase tracking-[0.2em]">
                    {mode === 'game' ? `Phase ${qIndex + 1} / 15` : 'Module Libre'}
                  </div>
                  <div className="text-right min-w-[3rem] text-slate-500 text-[10px] font-black uppercase mono tracking-widest">
                    {mode === 'game' && <span className="text-emerald-500">{score} </span>}
                    {mode === 'game' ? 'POINTS' : 'SÉANCE LIBRE'}
                  </div>
                </div>

                <div className="min-h-[220px] flex flex-col items-center justify-center mb-16">
                  {currentQuestion.type === 'NUMBER_TO_NAME' && (
                    <div className="text-center group">
                      <p className="text-slate-500 font-bold uppercase tracking-[0.3em] text-[10px] mb-6 opacity-60">Quelle est l'appellation du n°</p>
                      <p className="text-9xl font-black mono text-white tracking-tighter drop-shadow-[0_0_40px_rgba(255,255,255,0.15)] group-hover:scale-110 transition-transform duration-500">{currentQuestion.targetElement.number}</p>
                    </div>
                  )}
                  {currentQuestion.type === 'NAME_TO_NUMBER' && (
                    <div className="text-center">
                      <p className="text-slate-500 font-bold uppercase tracking-[0.3em] text-[10px] mb-8 opacity-60">Trouvez l'indice atomique de</p>
                      <div className="flex items-center justify-center gap-8">
                        <p className="text-5xl sm:text-7xl font-black text-white italic tracking-tighter drop-shadow-lg">{currentQuestion.targetElement.name}</p>
                        <div className="w-24 h-24 rounded-[2rem] border-4 flex items-center justify-center text-4xl font-black bg-white/5 shadow-2xl" style={{ borderColor: currentQuestion.targetElement.color, color: currentQuestion.targetElement.color }}>{currentQuestion.targetElement.symbol}</div>
                      </div>
                    </div>
                  )}
                  {currentQuestion.type === 'SYMBOL_TO_BOTH' && (
                    <div className="flex flex-col items-center">
                      <p className="text-slate-500 font-bold uppercase tracking-[0.3em] text-[10px] mb-10 opacity-60">Analyse de la particule</p>
                      <div className="w-36 h-36 rounded-[2.5rem] flex items-center justify-center text-7xl font-black shadow-[0_20px_60px_-15px_rgba(0,0,0,0.5)] border-4 bg-white/5" style={{ borderColor: currentQuestion.targetElement.color, color: currentQuestion.targetElement.color }}>
                        {currentQuestion.targetElement.symbol}
                      </div>
                    </div>
                  )}
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                  {currentQuestion.options.map((option, idx) => (
                    <button 
                      key={idx} 
                      onClick={() => handleOptionClick(option)} 
                      disabled={selectedOption !== null}
                      className={`p-7 rounded-3xl text-left transition-all duration-300 border-2 font-black uppercase tracking-widest text-xs
                        ${selectedOption === null ? 'hover:bg-blue-500/10 border-white/5 bg-slate-900/40 hover:border-blue-500/50 hover:scale-[1.03] active:scale-95' : 'cursor-default'}
                        ${selectedOption !== null && option === currentQuestion.correctAnswer ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400 shadow-[0_0_40px_rgba(16,185,129,0.3)]' : ''}
                        ${selectedOption === option && option !== currentQuestion.correctAnswer ? 'bg-rose-500/20 border-rose-500 text-rose-400' : ''}
                        ${selectedOption !== null && option !== currentQuestion.correctAnswer && option !== selectedOption ? 'opacity-10 scale-95 blur-[2px]' : ''}`}
                    >
                      {option}
                    </button>
                  ))}
                </div>

                <div className="mt-14 min-h-[90px] flex flex-col items-center justify-center">
                  {selectedOption !== null && (
                    <div className="text-center w-full animate-fade-in">
                      {selectedOption === '__TIMEOUT__' && <div className="mb-6 text-rose-500 font-black uppercase tracking-[0.3em] text-[10px] animate-pulse">ALERTE : TEMPS ÉCOULÉ</div>}
                      <button onClick={handleNext} className="px-20 py-5 bg-white text-slate-900 rounded-3xl font-black text-[10px] shadow-[0_20px_40px_-10px_rgba(255,255,255,0.2)] uppercase tracking-[0.4em] transition-all hover:scale-105 active:scale-95">
                        {mode === 'game' && qIndex >= 14 ? 'Voir le bilan' : 'Étape suivante'}
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        };

        // --- MAIN APP ---
        const App = () => {
          const [view, setView] = useState('menu'); // menu, game, training, revision
          const [elements, setElements] = useState([]);
          const [isLoading, setIsLoading] = useState(true);
          const [highscore, setHighscore] = useState(0);

          useEffect(() => {
            const saved = localStorage.getItem('periodic_highscore');
            if (saved) setHighscore(parseInt(saved));

            fetch('elements.json')
              .then(res => res.json())
              .then(data => { setElements(data); setIsLoading(false); })
              .catch(() => setIsLoading(false));
          }, []);

          const updateHighscore = (score) => {
            if (score > highscore) {
              setHighscore(score);
              localStorage.setItem('periodic_highscore', score.toString());
            }
          };

          if (isLoading) {
            return (
              <div className="min-h-screen flex flex-col items-center justify-center">
                <div className="w-16 h-1 w-32 bg-slate-800 rounded-full overflow-hidden">
                  <div className="h-full bg-blue-500 animate-[loading_1.5s_infinite_ease-in-out]"></div>
                </div>
                <style>{`@keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }`}</style>
              </div>
            );
          }

          return (
            <div className="min-h-screen relative flex flex-col">
              <Header onBack={() => setView('menu')} isHome={view === 'menu'} />
              
              <main className="relative z-10 w-full flex-grow">
                {view === 'menu' && <MainMenu onSelectMode={setView} highscore={highscore} />}
                
                {view === 'revision' && <RevisionView elements={elements} />}
                
                {(view === 'game' || view === 'training') && (
                  <QuizView 
                    elements={elements} 
                    mode={view} 
                    onBack={() => setView('menu')} 
                    onComplete={updateHighscore}
                  />
                )}
              </main>

              <footer className="w-full py-8 text-center pointer-events-none opacity-20">
                <p className="text-[8px] font-black uppercase tracking-[1em] text-slate-400">118 Éléments • Engine v3.0 • Creative Minds</p>
              </footer>
            </div>
          );
        };

        ReactDOMRoot.render(<App />);
    </script>
</body>
</html>
