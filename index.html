            }
        }
        @layer components {
            .mono { font-family: 'JetBrains+Mono', monospace; }

                @apply bg-slate-800/60 backdrop-blur-xl border border-white/10;
            }
            .custom-scrollbar::-webkit-scrollbar {

        const RevisionView = () => {

        const QuizView = () => {
          const [currentQuestion, setCurrentQuestion] = useState(null);
          const [selectedOption, setSelectedOption] = useState(null);

          const generateQuestion = useCallback(() => {
            const types = ['NUMBER_TO_NAME', 'NAME_TO_NUMBER', 'SYMBOL_TO_BOTH'];
            const type = types[Math.floor(Math.random() * types.length)];
            const target = ALL_ELEMENTS[Math.floor(Math.random() * ALL_ELEMENTS.length)];
            
            const getOptionString = (el, qType) => {
              if (qType === 'NUMBER_TO_NAME') return el.name;
              if (qType === 'NAME_TO_NUMBER') return el.number.toString();
              return `${el.name} (${el.number})`;
            };

            const correctAnswer = getOptionString(target, type);
            const options = [correctAnswer];
            while (options.length < 4) {
              const randomEl = ALL_ELEMENTS[Math.floor(Math.random() * ALL_ELEMENTS.length)];
              const opt = getOptionString(randomEl, type);
              if (!options.includes(opt)) options.push(opt);
            }

            setCurrentQuestion({ type, targetElement: target, options: options.sort(() => Math.random() - 0.5), correctAnswer });
            setSelectedOption(null);
          }, []);

          useEffect(() => { generateQuestion(); }, [generateQuestion]);

          const handleOptionClick = (option) => {
            if (selectedOption !== null) return;
            setSelectedOption(option);
          };

          if (!currentQuestion) return null;

          return (
            <div className="max-w-2xl mx-auto glass p-8 rounded-3xl shadow-2xl animate-fade-in">
              <div className="mb-10 text-center">
                <span className="inline-block px-4 py-1.5 rounded-full bg-slate-800 text-[10px] font-bold text-blue-400 uppercase tracking-[0.25em] mb-6 border border-slate-700">Défi Infini</span>
                <div className="min-h-[160px] flex flex-col items-center justify-center">

                    <div className="text-center">
                      <p className="text-slate-400 mb-3 text-lg">Quel est le nom de l'élément numéro</p>
                      <p className="text-8xl font-black mono text-white tracking-tighter">{currentQuestion.targetElement.number}</p>
                    </div>
                  )}
                  {currentQuestion.type === 'NAME_TO_NUMBER' && (
                    <div className="text-center">
                      <p className="text-slate-400 mb-3 text-lg">Numéro atomique de l'élément</p>
                      <p className="text-5xl sm:text-7xl font-bold text-white italic">{currentQuestion.targetElement.name}</p>
                    </div>
                  )}
                  {currentQuestion.type === 'SYMBOL_TO_BOTH' && (
                    <div className="flex flex-col items-center">
                      <p className="text-slate-400 mb-6 text-lg">Nom et numéro pour le symbole</p>
                      <div className="w-28 h-28 rounded-3xl flex items-center justify-center text-5xl font-bold shadow-2xl border-2 bg-white/5" style={{ borderColor: currentQuestion.targetElement.color, color: currentQuestion.targetElement.color }}>
                        {currentQuestion.targetElement.symbol}
                      </div>
                    </div>
                  )}
                </div>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {currentQuestion.options.map((option, idx) => (
                  <button key={idx} onClick={() => handleOptionClick(option)} disabled={selectedOption !== null}
                    className={`p-6 rounded-2xl text-left transition-all duration-300 border shadow-sm text-lg font-medium
                      ${selectedOption === null ? 'hover:bg-slate-700/50 border-white/5 bg-slate-800/40 hover:scale-[1.03] active:scale-95' : 'cursor-default'}
                      ${selectedOption !== null && option === currentQuestion.correctAnswer ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300 shadow-[0_0_20px_rgba(16,185,129,0.2)]' : ''}
                      ${selectedOption === option && option !== currentQuestion.correctAnswer ? 'bg-rose-500/20 border-rose-500 text-rose-300' : ''}
                      ${selectedOption !== null && option !== currentQuestion.correctAnswer && option !== selectedOption ? 'opacity-20 scale-95' : ''}`}
                  >{option}</button>
                ))}
              </div>
              <div className="mt-10 min-h-[100px] flex flex-col items-center justify-center">
                {selectedOption !== null && (
                  <div className="text-center w-full animate-fade-in">
                    <button onClick={generateQuestion} className="px-14 py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-full font-black text-lg shadow-2xl uppercase tracking-widest transition-transform hover:scale-105 active:scale-95">Suivant</button>
                  </div>
                )}
              </div>
            </div>
          );
        };

        const App = () => {
          const [activeTab, setActiveTab] = useState('quiz');
          return (
            <div className="min-h-screen flex flex-col items-center p-4">
              <header className="mb-8 text-center mt-6">
                <h1 className="text-3xl sm:text-5xl font-black bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-teal-400 to-emerald-400 mb-6 tracking-tighter">Periodic Master</h1>
                <div className="inline-flex p-1 bg-slate-900/60 backdrop-blur-2xl rounded-2xl border border-white/5 shadow-2xl">
                  <button onClick={() => setActiveTab('quiz')} className={`px-8 py-3 rounded-xl text-sm font-bold transition-all duration-300 ${activeTab === 'quiz' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:text-slate-200'}`}>Quiz</button>
                  <button onClick={() => setActiveTab('revision')} className={`px-8 py-3 rounded-xl text-sm font-bold transition-all duration-300 ${activeTab === 'revision' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:text-slate-200'}`}>Tableau</button>
                </div>
              </header>
              <main className="w-full">{activeTab === 'quiz' ? <QuizView /> : <RevisionView />}</main>
              <footer className="mt-auto py-8 text-slate-500 text-[9px] uppercase tracking-[0.4em] opacity-40 font-bold text-center">118 Éléments • Pas de points • Savoir Infini</footer>
            </div>
          );
        };

        ReactDOMRoot.render(<App />);
    </script>
</body>
</html>
